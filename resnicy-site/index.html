<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // .js — скрипты есть: элементы можно прятать до появления на экране.
      // .play-intro — показать интро (первый заход в сессии и без «уменьшения движения»).
      // Если за 2 с приложение не запустилось, оба класса снимаются и всё видно статично.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && !sessionStorage.getItem("intro-seen")) {
            d.classList.add("play-intro");
            sessionStorage.setItem("intro-seen", "1");
          }
        } catch (e) {}
        setTimeout(function () {
          if (!window.__ready) d.classList.remove("js", "play-intro");
        }, 2000);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%BRAND% — ламинирование и наращивание ресниц в Минске</title>
    <meta
      name="description"
      content="Ламинирование и наращивание ресниц в Минске. Ламинирование занимает около часа: смотри до/после, как проходит процедура и работы."
    />
    <meta name="theme-color" content="#0C0812" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_BY" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:title" content="%BRAND% — ресницы в Минске" />
    <meta property="og:description" content="Ламинирование и наращивание ресниц. До/после за 60 минут." />
    <meta property="og:image" content="./og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- После подключения домена: <link rel="canonical" href="https://ДОМЕН/" /> и абсолютный адрес og:image -->
    <link rel="icon" href="%FAVICON%" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="./media/hero-1440.webp"

    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
