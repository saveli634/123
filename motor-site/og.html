<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <style>
      html,body{margin:0;width:1200px;height:630px;background:#0a0b0d;overflow:hidden}p{margin:0}
      .og{position:relative;width:1200px;height:630px;background:radial-gradient(70% 90% at 72% 55%,#1a0d0f 0%,#0a0b0d 62%)}
      .eng{position:absolute;right:-40px;top:40px;width:760px;height:560px;object-fit:contain}

      .t span{display:block}
      .c{color:#868d98}
      .m{position:absolute;left:66px;top:96px;font:600 16px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#868d98}
      .r{position:absolute;left:66px;bottom:72px;width:120px;height:3px;background:#d3202b}

      .cross{position:absolute;width:14px;height:14px}

  </head>
  <body>
    <div class="og">

    </div>
  </body>
