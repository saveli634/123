<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // .js — включает анимации проявления; .seen — повторный заход (без прелоадера); .rm — reduced motion.
      // Если скрипт сайта не запустился за 2 с, .js снимается и всё видно сразу.
      (function (d) {
        d.classList.add("js");
        try {
          if (sessionStorage.getItem("qb-seen") || localStorage.getItem("qb-seen")) d.classList.add("seen");
          localStorage.setItem("qb-seen", "1");
          sessionStorage.setItem("qb-seen", "1");
        } catch (e) {}
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("rm");
        setTimeout(function () {
          if (!window.__qbReady) d.classList.remove("js");
        }, 2000);
      })(document.documentElement);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%QB_TITLE%</title>
    <meta name="description" content="%QB_DESC%" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Queen Bee Boheme Residence" />
    <meta property="og:title" content="Queen Bee Boheme Residence" />
    <meta property="og:description" content="%QB_DESC%" />
    <meta property="og:image" content="./og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- После подключения домена: <link rel="canonical" href="https://ДОМЕН/" /> и абсолютный адрес og:image -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="application/ld+json">%QB_LD%</script>
  </head>
  <body>
    <div class="preloader" aria-hidden="true">
      <svg class="preloader-mark" viewBox="-60 -60 120 120" width="120" height="120">
        <polygon class="preloader-hex" points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" />
        <g class="preloader-bee">
          <ellipse cx="-10" cy="-5" rx="10" ry="5.6" transform="rotate(-28 -10 -5)" class="pb-wing" />
          <ellipse cx="10" cy="-5" rx="10" ry="5.6" transform="rotate(28 10 -5)" class="pb-wing" />
          <ellipse cx="0" cy="6" rx="6" ry="12" class="pb-body" />
          <path d="M-5.6 2h11.2v3H-5.6zM-5 9h10v3H-5z" class="pb-stripe" />
          <circle cx="0" cy="-9.5" r="5" class="pb-head" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
